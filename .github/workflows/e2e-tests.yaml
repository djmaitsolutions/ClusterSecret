---
name: E2E Tests

on:
  push:
  pull_request:
  workflow_dispatch:  # Allow manual trigger

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.25.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kind cluster
        run: |
          kind create cluster --name clustersecret-operator --wait 5m
          kubectl cluster-info --context kind-clustersecret-operator

      - name: Run e2e tests
        run: make test-e2e
        env:
          KIND_CLUSTER: clustersecret-operator

      - name: Show cluster state on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Events in clustersecret-system ==="
          kubectl get events -n clustersecret-system --sort-by='.lastTimestamp'
          echo ""
          echo "=== Pod descriptions ==="
          kubectl describe pods -n clustersecret-system
          echo ""
          echo "=== Controller logs ==="
          kubectl logs -l control-plane=controller-manager -n clustersecret-system --tail=200 || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name clustersecret-operator
