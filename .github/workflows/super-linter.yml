---
name: Lint

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go lint (golangci-lint)
        run: make lint

      - name: Super-linter (non-Go files)
        uses: super-linter/super-linter/slim@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          # Only enable specific linters for Go rewrite
          VALIDATE_BASH: true
          VALIDATE_DOCKERFILE_HADOLINT: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_YAML: true
          LINTER_RULES_PATH: ".github/workflows/linters"
          # Exclude legacy Python workflows and Helm templates
          FILTER_REGEX_EXCLUDE: "(build-test|build|e2e-testing|helm-release)\\.yaml$|charts/.*/templates/.*\\.yaml$"



